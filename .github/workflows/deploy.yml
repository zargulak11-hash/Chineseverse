name: CI and Deploy

# Every push and pull request runs the checks; a push to main deploys only
# after all of them pass. Deploying used to be the only job, so a broken
# change reached production untested.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Never run two deploys of main at once; checks on other refs may overlap.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  backend-tests:
    name: Backend tests (pytest)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12" # the version in backend/Dockerfile
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - name: Install dependencies
        run: pip install -r requirements-dev.txt
      # The suite builds its own throwaway SQLite databases and forces SMTP
      # and Gemini off (tests/conftest.py); it needs no secrets. Branch
      # coverage below 85% (about 90% today) fails the job, so a large
      # untested change can't slip in.
      - name: Run pytest with coverage
        run: python -m pytest -q --cov --cov-report=term --cov-report=xml --cov-fail-under=85
      - name: Keep the coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: backend/coverage.xml
          if-no-files-found: ignore

  postgres-migrations:
    name: Migrations and boot on PostgreSQL
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine # the image in docker-compose.yml
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: chineseverse_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d chineseverse_ci"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      # A throwaway database inside this job only.
      DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/chineseverse_ci
      AI_PROVIDER: offline
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Upgrade an empty database to head
        run: python -m alembic upgrade head
      - name: Re-apply the newest migration (downgrade one, upgrade again)
        run: |
          python -m alembic downgrade -1
          python -m alembic upgrade head
      # The app's own startup (migrations + idempotent seed) on PostgreSQL,
      # the engine production runs; the pytest job covers SQLite.
      - name: Boot the API and read seeded content
        run: |
          python - <<'EOF'
          from fastapi.testclient import TestClient
          from app.main import app

          with TestClient(app) as client:
              assert client.get("/health").json() == {"status": "ok"}
              levels = client.get("/api/hsk/levels").json()
              assert len(levels) == 7, levels
              assert len(client.get("/api/animals").json()) == 20
          print("API booted on PostgreSQL with the seeded curriculum")
          EOF

  frontend-build:
    name: Frontend build and i18n keys
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20" # the version in frontend/Dockerfile
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Unit tests (vitest)
        run: npm test
      - name: Build
        run: npm run build
      - name: Every locale has every key
        run: python3 scripts/check_i18n_keys.py

  deploy:
    name: Deploy to production
    needs: [backend-tests, postgres-migrations, frontend-build]
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      # The server's host key is checked against SSH_KNOWN_HOSTS, a
      # repository secret holding known_hosts line(s) for 37.27.245.216 whose
      # fingerprint was compared with the one shown in the hosting
      # provider's own console (not over SSH, which is the path being
      # verified). It used to be StrictHostKeyChecking=no, which would have
      # run the deploy against whatever machine answered at that address.
      # Without the secret the deploy stops here instead of connecting
      # unverified. Secrets reach the script through env, never pasted into
      # its text; a value pasted from Windows may carry CR characters, which
      # are stripped. The pinned fingerprint is printed (it is public) so a
      # run can be checked against the console's value.
      - name: Deploy to server
        env:
          SSH_KEY: ${{ secrets.SSH_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
        run: |
          # Stop at the first failure (a malformed secret must never reach
          # the ssh line), whatever the runner's default shell options are.
          set -euo pipefail
          if [ -z "$SSH_KNOWN_HOSTS" ]; then
            echo "::error::SSH_KNOWN_HOSTS secret is missing -- refusing to deploy to an unverified host"
            exit 1
          fi
          install -d -m 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" | tr -d '\r' > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$SSH_KNOWN_HOSTS" | tr -d '\r' > ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts
          # Fails on a malformed secret; prints only public fingerprints.
          ssh-keygen -l -f ~/.ssh/known_hosts
          ssh -o StrictHostKeyChecking=yes dev@37.27.245.216 "~/deploy_chineseverse.sh"
