# Security headers for every response this nginx sends (the SPA pages,
# assets, and the proxied /api/ and /static/ answers). Included in the
# server block AND in every location that has its own add_header: nginx
# drops all inherited add_header lines in a block that sets any, so a
# location without this include would silently send none of them
# (src/securityHeaders.test.js checks that).
#
# This nginx sits behind the server's HTTPS proxy, which passes these
# through. HSTS is ignored by browsers over plain http (local Docker), and
# has no includeSubDomains/preload: it covers chineseverse.qobus.tj only.
add_header Strict-Transport-Security "max-age=15552000" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
# Google Identity Services needs the page's origin in its requests; the
# full URL (reset-password#token is a fragment and never sent anyway) stays
# on this site.
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
# The Tone Coach and voice answers use the microphone; nothing uses the
# camera, location or payments.
add_header Permissions-Policy "camera=(), geolocation=(), payment=(), usb=(), microphone=(self)" always;
# REPORT-ONLY on purpose: browsers log violations in the console but block
# nothing, because Google sign-in, the microphone pages and the assistant
# can only be checked in a real browser on the real site. Watch the console
# there, add anything reported, then rename the header to enforce it.
#
# The 'sha256-...' source is index.html's one executable inline script (the
# theme set before first paint, copied unchanged into every built page):
# without it every page load reported a violation, and enforcing would break
# the theme. Editing that script changes its hash -- src/securityHeaders.test.js
# fails until this value is updated. The JSON-LD block is data, never run,
# so CSP does not apply to it.
#
# 'unsafe-hashes' + the second hash allow exactly ONE inline event handler,
# the Google Fonts stylesheet's onload="this.media='all'" (it loads without
# blocking the first paint). Without them every page reported it, and an
# enforced policy would leave the fonts unloaded. It allows no other handler
# and no inline <script>. Browsers that don't know 'unsafe-hashes' would
# block that one handler once enforced (system fonts, nothing broken);
# moving the fonts to a plain <link> would remove the need for it.
add_header Content-Security-Policy-Report-Only "default-src 'self'; script-src 'self' 'sha256-i+M+wlZJZE4nxCI71MxOxjyBDLLmugJbNG/6ZcjsePI=' 'unsafe-hashes' 'sha256-MhtPZXr7+LpJUY5qtMutB+qWfQtMaPccfe7QXtCcEYc=' https://accounts.google.com/gsi/client; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://accounts.google.com/gsi/style; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob: https:; media-src 'self' data: blob:; connect-src 'self' https://accounts.google.com/gsi/; frame-src https://accounts.google.com/gsi/; worker-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'self' https://github.com; frame-ancestors 'none'" always;
