<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ChineseVerse</title>
    <!-- Tab / window icon: the pagoda-and-book emblem cropped out of the
         real logo with a transparent background, like the in-app logo,
         shipped as square PNGs plus an .ico for browsers that probe /favicon.ico
         without a <link>. The horizontal wordmark is unreadable below ~48px,
         so only the emblem is used. Generated by
         scripts/build_brand_assets.mjs; the PNG in frontend/photo is never
         modified. -->
    <link rel="icon" href="/favicon.ico" sizes="16x16 32x32 48x48" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="48x48" href="/favicon-48.png" />
    <link rel="icon" type="image/png" sizes="64x64" href="/favicon-64.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- The web fonts must never hold the page back: a render-blocking
         stylesheet kept the whole app blank wherever fonts.googleapis.com is
         slow or unreachable (it is blocked in mainland China). Loaded as
         "print" and switched on when it arrives, so the app paints at once in
         the system fallback (--font-ui) and swaps the fonts in. -->
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Noto+Sans+SC:wght@400;500;700;900&display=swap"
      media="print"
      onload="this.media='all'"
    />
    <noscript>
      <link
        rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Noto+Sans+SC:wght@400;500;700;900&display=swap"
      />
    </noscript>
    <script src="https://accounts.google.com/gsi/client" async defer></script>
    <script>
      // Set the theme before first paint so switching themes doesn't flash
      // the other one on reload — main.jsx/theme.js owns this key afterward.
      try {
        var t = localStorage.getItem("chineseverse_theme");
        document.documentElement.setAttribute("data-theme", t === "paper" ? "paper" : "ink");
      } catch (e) {
        document.documentElement.setAttribute("data-theme", "ink");
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
