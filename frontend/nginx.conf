server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # Same-origin /api calls (api.js hits "/api/...") get proxied straight
    # through to the backend container — no URI rewrite, since the backend
    # already expects the full /api/... path.
    # The assistant streams its answer (NDJSON) and may carry an image or a
    # PDF: no response buffering, so text reaches the browser as it is
    # written and Stop takes effect at once; a body limit above nginx's 1 MB
    # default (the backend itself caps attachments at 9 MB); and time for a
    # long answer.
    location /api/assistant/ {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 14m;
        proxy_buffering off;
        proxy_read_timeout 180s;
    }

    location /api/ {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Uploaded profile pictures (backend app/main.py's /static mount).
    location /static/ {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    # Client-side routing (react-router): unknown paths fall back to
    # index.html instead of a raw nginx 404.
    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(?:js|css|svg|woff2?)$ {
        expires 7d;
        add_header Cache-Control "public, max-age=604800, immutable";
    }
}
