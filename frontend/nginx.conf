server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    # Redirects say "Location: /download", not "http://<container>:80/...":
    # this nginx sits behind the server's HTTPS proxy, and an absolute
    # http:// address cost every redirect a second hop back to https.
    absolute_redirect off;
    # No nginx version in the Server header or error pages.
    server_tokens off;
    # HSTS, nosniff, anti-framing, referrer, permissions, report-only CSP.
    # Repeated in every location below that has its own add_header.
    include /etc/nginx/snippets/security-headers.conf;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # Same-origin /api calls (api.js hits "/api/...") get proxied straight
    # through to the backend container — no URI rewrite, since the backend
    # already expects the full /api/... path.
    # The assistant streams its answer (NDJSON) and may carry an image or a
    # PDF: no response buffering, so text reaches the browser as it is
    # written and Stop takes effect at once; a body limit above nginx's 1 MB
    # default (the backend itself caps attachments at 9 MB); and time for a
    # long answer.
    # "^~" on the proxied prefixes: nginx tries regex locations before plain
    # prefixes, so without it the page rules below (the trailing-slash
    # redirect, the asset cache rule) would also catch API and upload URLs.
    location ^~ /api/assistant/ {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 14m;
        proxy_buffering off;
        proxy_read_timeout 180s;
    }

    # Profile photos may be up to 3 MB (routers/me.py MAX_AVATAR_BYTES);
    # nginx's 1 MB default refused the larger ones before the API saw them.
    location ^~ /api/ {
        client_max_body_size 4m;
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Uploaded profile pictures (backend app/main.py's /static mount).
    location ^~ /static/ {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    # Client-side routing (react-router), told apart for search engines
    # (src/seo.js has the reasons). Every path used to fall back to
    # index.html with a 200, so a typo, /robots.txt and every private page
    # looked to Google like another copy of the home page.
    #
    # The two public pages: their own HTML, with their own title,
    # description and canonical address.
    location = / {
        try_files /index.html =404;
    }
    location = /download {
        try_files /download.html =404;
    }
    # The same pages under their file names are duplicates: send them home.
    location = /index.html {
        return 301 /;
    }
    location = /download.html {
        return 301 /download;
    }

    # One address per page: "/download/" -> "/download" (query kept).
    location ~ ^(/.+)/$ {
        return 301 $1$is_args$args;
    }

    # Sign-in forms and every page behind sign-in (the routes in App.jsx;
    # seo.test.js fails the build when one is missing here). They work as
    # before -- the app decides what to show -- but are never indexed:
    # learners' pages, reset-password tokens and admin stay out of search.
    # A route missing from this list still works for the visitor; it only
    # answers 404 below.
    location ~ ^/(?:login|register|forgot-password|reset-password|auth|onboarding|animals|journey|foundation|stories|real-chinese|tone-coach|roleplay|sentence|detective|sound-world|hanzi|ecosystem|internet|passport|dashboard|dna|roadmap|lessons|vocabulary|grammar|quests|missions|duels|achievements|companion|voice-companion|pet-teacher|practice|exam|review|mistakes|progress|profile|settings|assistant|community|u|admin|world|conversation|cases)(?:/[^.]*)?$ {
        rewrite ^ /app.html last;
    }
    location = /app.html {
        internal;
        add_header X-Robots-Tag "noindex" always;
        include /etc/nginx/snippets/security-headers.conf;
    }

    # Real files (assets, icons, robots.txt, sitemap.xml) or a real 404. The
    # 404 page is the app shell, so a visitor on a dead link still gets the
    # app (which takes them home) while crawlers get the honest status.
    location / {
        try_files $uri =404;
    }
    error_page 404 /app.html;

    # The landing page's video tour and its poster (public/media/). Plain
    # static files: nginx answers byte-range requests for them on its own,
    # which is what lets the player seek and lets phones stream instead of
    # downloading the whole file first. Not "immutable": the names carry no
    # content hash, so a replaced video reaches visitors within a day.
    location ^~ /media/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=86400";
        include /etc/nginx/snippets/security-headers.conf;
    }

    # No `expires` here: it adds its own Cache-Control header, so every
    # asset went out with two. This one says the same 7 days.
    location ~* \.(?:js|css|svg|woff2?)$ {
        add_header Cache-Control "public, max-age=604800, immutable";
        include /etc/nginx/snippets/security-headers.conf;
    }
}
