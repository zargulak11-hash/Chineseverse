[pytest]
testpaths = tests
python_files = test_*.py
addopts = -ra --strict-markers
markers =
    migration: builds a database at an older Alembic revision and upgrades it
filterwarnings =
    # The codebase stores naive UTC timestamps via datetime.utcnow() by
    # convention; its deprecation notice would bury real warnings.
    ignore:datetime.datetime.utcnow:DeprecationWarning
